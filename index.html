<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro-плитка Windows 8</title>
    <style>
        body {
            background-color: #111122;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
            overflow-x: auto;
            overflow-y: hidden;
            height: 100vh;
        }

        .metro-header {
            display: flex;
            justify-content: space-between;
            max-width: 100%;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: 300;
            padding: 0 10px;
            user-select: none;
        }

        .title-user {
            font-size: 20px;
            align-self: flex-end;
        }

        .menu {
            display: flex;
            flex-direction: row; 
            flex-shrink: 0; 
            gap: 40px; 
            height: 420px; 
            width: max-content; 
        }

        .tile-group {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap; 
            gap: 20px; 
            flex-shrink: 0; 
        }

        .tile {
            width: 120px;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: transform 0.1s ease;
            flex-shrink: 0; 
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            user-select: none;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile--wide {
            width: 260px; 
        }

        .tile--big {
            width: 260px;
            height: 260px; 
        }

        .tile--pink { background-color: #d80073; }
        .tile--orange { background-color: #f0a30a; }
        .tile--yellow { background-color: #e3c800; }
        .tile--green { background-color: #60a917; }
        .tile--teal { background-color: #00aba9; }
    </style>
</head>
<body>

    <header class="metro-header">
        <span class="title-start">Пуск</span>
        <span class="title-user">User</span>
    </header>

    <main class="menu">
        
        <div class="tile-group">
            <div class="tile tile--pink">Календарь</div>
            <div class="tile tile--pink">Почта</div>
            <div class="tile tile--pink">Люди</div>
            <div class="tile tile--pink">Сообщения</div>
        </div>

        <div class="tile-group">
            <div class="tile tile--wide tile--orange">Рабочий стол</div>
            <div class="tile tile--orange">Музыка</div>
            <div class="tile tile--orange">Видео</div>
            <div class="tile tile--big tile--orange">Игры</div>
        </div>

        <div class="tile-group">
            <div class="tile tile--yellow">Финансы</div>
            <div class="tile tile--yellow">Карты</div>
            <div class="tile tile--yellow">Погода</div>
            <div class="tile tile--yellow">Спорт</div>
            <div class="tile tile--yellow">Новости</div>
        </div>

        <div class="tile-group">
            <div class="tile tile--wide tile--green">Фотографии</div>
            <div class="tile tile--green">Камера</div>
            <div class="tile tile--green">Магазин</div>
        </div>

        <div class="tile-group">
            <div class="tile tile--teal">Справка</div>
            <div class="tile tile--teal">Параметры</div>
            <div class="tile tile--wide tile--teal">Internet Explorer</div>
        </div>
        
    </main>

</body>
</html>
